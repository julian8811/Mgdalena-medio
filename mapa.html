 </a>

 <nav id="nav-panel" class="hidden md:flex w-full md:w-auto flex-col md:flex-row gap-1 md:gap-6 text-sm font-bold text-primary pb-2 md:pb-0">

<main class="pt-20 pb-16 px-4 md:px-6 max-w-6xl mx-auto">
<div class="map-page-intro reveal mb-8">
<h1 class="text-3xl md:text-4xl font-extrabold font-headline text-on-surface">Rutas en mapa</h1>
</div>

<div class="map-stage mb-7 reveal" data-delay="80">
<div class="map-stage-inner">
<div id="mapa-rutas" aria-label="Mapa interactivo de rutas"></div>
<div class="map-floating-badge">
<span class="material-symbols-outlined" aria-hidden="true">explore</span>
Puerto Berrío · Maceo
</div>
</div>
</div>

<div class="map-route-toolbar reveal" data-delay="140">
<div class="map-route-scroll" role="group" aria-label="Elegir ruta en el mapa">
<button type="button" data-ruta="1" class="map-route-btn is-active" aria-pressed="true"><span class="route-dot" aria-hidden="true"></span>Ruta 1 · Esencial</button>
<button type="button" data-ruta="2" class="map-route-btn" aria-pressed="false"><span class="route-dot" aria-hidden="true"></span>Ruta 2 · Balneario</button>
<button type="button" data-ruta="3" class="map-route-btn" aria-pressed="false"><span class="route-dot" aria-hidden="true"></span>Ruta 3 · Histórica</button>
<button type="button" data-ruta="4" class="map-route-btn" aria-pressed="false"><span class="route-dot" aria-hidden="true"></span>Ruta 4 · Ganadera</button>
<button type="button" data-ruta="5" class="map-route-btn" aria-pressed="false"><span class="route-dot" aria-hidden="true"></span>Ruta 5 · Completa</button>
<button type="button" data-ruta="6" class="map-route-btn" aria-pressed="false"><span class="route-dot" aria-hidden="true"></span>Ruta 1 · Cocreación ganadera</button>
<button type="button" data-ruta="7" class="map-route-btn" aria-pressed="false"><span class="route-dot" aria-hidden="true"></span>Ruta 2 · Cocreación histórica</button>
